[project]
name = "agent-watson-concept-graph"
version = "0.1.0"
description = "Concept Graph for Agent Watson — in-memory concept organisation over extracted memories"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
