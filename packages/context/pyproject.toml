[project]
name = "agent-watson-context"
version = "0.1.0"
description = "Context Retrieval Engine for Agent Watson — deterministic cross-session search and scoring"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
