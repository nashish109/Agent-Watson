[project]
name = "agent-watson-reflection"
version = "0.1.0"
description = "Reflection Engine V2 for Agent Watson — deterministic session reflection using memories, concepts, relationships, and context"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
